<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>Agent Vault</title><link rel="icon" href="/vault.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"></head>
<body>
<svg class="svg-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
  <symbol id="av-icon-vault" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="17" rx="4"/><path d="M6 20v1m12-1v1M3 8h2m-2 7h2"/><circle cx="13" cy="11.5" r="4"/><circle cx="13" cy="11.5" r=".7"/><path d="m13 10.8 1.6-1.6M13.7 11.8l2 .6m-3.1-.2-.7 2"/></symbol>
  <symbol id="av-icon-connections" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/><path d="M14 6h3a1 1 0 0 1 1 1v3M6 14v3a1 1 0 0 0 1 1h3"/></symbol>
  <symbol id="av-icon-plug" viewBox="0 0 24 24"><path d="m9 3 1 4m5-4-1 4M6 7h12v3a6 6 0 0 1-6 6h0a6 6 0 0 1-6-6V7Zm6 9v5"/></symbol>
  <symbol id="av-icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="av-icon-settings" viewBox="0 0 24 24"><path d="M4 7h7m5 0h4M4 17h3m5 0h8"/><circle cx="13.5" cy="7" r="2.5"/><circle cx="9.5" cy="17" r="2.5"/></symbol>
  <symbol id="av-icon-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/></symbol>
  <symbol id="av-icon-unlock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 7.5-2M12 15v2"/></symbol>
  <symbol id="av-icon-shield" viewBox="0 0 24 24"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z"/><path d="m8.5 11.5 2.5 2.5 4.5-5"/></symbol>
  <symbol id="av-icon-device" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2.5"/><path d="M9 21h6m-3-4v4"/></symbol>
  <symbol id="av-icon-server" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="8" rx="2.5"/><rect x="3" y="13" width="18" height="8" rx="2.5"/><path d="M7 7h.01M7 17h.01M15 7h2m-2 10h2"/></symbol>
  <symbol id="av-icon-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="8" ry="3.5"/><path d="M4 5.5v13c0 2 3.6 3.5 8 3.5s8-1.5 8-3.5v-13M4 12c0 2 3.6 3.5 8 3.5s8-1.5 8-3.5"/></symbol>
  <symbol id="av-icon-browser" viewBox="0 0 24 24"><rect x="2.5" y="3.5" width="19" height="17" rx="3"/><path d="M3 8.5h18M6 6h.01M9 6h.01M9 13l-2 2 2 2m6-4 2 2-2 2"/></symbol>
  <symbol id="av-icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="av-icon-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4.5 4.5"/></symbol>
  <symbol id="av-icon-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="av-icon-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5m6-6-6 6 6 6"/></symbol>
  <symbol id="av-icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
  <symbol id="av-icon-x" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
  <symbol id="av-icon-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2.5"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></symbol>
  <symbol id="av-icon-key" viewBox="0 0 24 24"><circle cx="8" cy="8" r="5"/><path d="m11.5 11.5 9 9m-3-3 3-3m-6 0 3-3"/></symbol>
  <symbol id="av-icon-refresh" viewBox="0 0 24 24"><path d="M20 10a8 8 0 0 0-14-5L3 8m0-5v5h5M4 14a8 8 0 0 0 14 5l3-3m0 5v-5h-5"/></symbol>
  <symbol id="av-icon-power" viewBox="0 0 24 24"><path d="M12 2v10M6.4 5.6a8 8 0 1 0 11.2 0"/></symbol>
  <symbol id="av-icon-terminal" viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="16" rx="3"/><path d="m6.5 9 3.5 3-3.5 3M13 15h4"/></symbol>
  <symbol id="av-icon-spark" viewBox="0 0 24 24"><path d="M12 2v20M2 12h20M5 5l14 14M5 19 19 5M8 3l8 18M3 8l18 8M3 16 21 8M8 21 16 3"/></symbol>
  <symbol id="av-icon-bot" viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="13" rx="4"/><path d="M12 7V3m-2 0h4M8 12v2m8-2v2m-7 3h6M4 12H2m18 0h2"/></symbol>
  <symbol id="av-icon-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></symbol>
  <symbol id="av-icon-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10h.01"/></symbol>
</svg>

<div class="app">
  <header class="titlebar"><a class="brand" href="/" aria-label="Agent Vault 首页"><span class="mark"><svg class="icon" aria-hidden="true"><use href="#av-icon-vault"></use></svg></span><span>Agent Vault</span></a><span class="local"><span class="status-dot"></span>在此设备运行</span></header>
  <div class="shell">
    <aside><div class="space"><span class="workspace-icon"><svg class="icon" aria-hidden="true"><use href="#av-icon-vault"></use></svg></span><div><strong>个人保险库</strong><span>你的本机凭据空间</span></div></div><div class="nav-label">工作空间</div><nav aria-label="主导航"><button data-page="targets" class="active"><svg class="icon" aria-hidden="true"><use href="#av-icon-connections"></use></svg><span>连接管理</span></button><button data-page="agents"><svg class="icon" aria-hidden="true"><use href="#av-icon-plug"></use></svg><span>Agent 集成</span></button><button data-page="history"><svg class="icon" aria-hidden="true"><use href="#av-icon-clock"></use></svg><span>使用记录</span></button><button data-page="settings"><svg class="icon" aria-hidden="true"><use href="#av-icon-settings"></use></svg><span>设置</span></button></nav><div class="aside-bottom"><button id="lock-button"><svg class="icon" aria-hidden="true"><use href="#av-icon-lock"></use></svg><span>锁定保险库</span></button><div class="device"><svg class="icon" aria-hidden="true"><use href="#av-icon-device"></use></svg><span>Windows · 本地存储</span></div></div></aside>
    <main id="main" aria-live="polite"><div class="loading">正在打开保险库…</div></main>
  </div>
  <footer><span class="footer-state"><span class="status-dot"></span><span id="lock-status">正在连接…</span></span><span class="footer-privacy"><svg class="icon" aria-hidden="true"><use href="#av-icon-shield"></use></svg>凭据在本机加密保存</span></footer>
</div>
<div id="dialog-root"></div><div id="toast" role="status" hidden></div>
<script src="/app.js"></script>
</body></html>
